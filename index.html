<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozod Trader Algorithm Pro</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Consolas', 'Segoe UI', monospace; background-color: #050508; color: #e2e8f0; margin: 0; padding: 15px; min-height: 100vh; }
        .navbar { display: flex; flex-direction: column; gap: 10px; align-items: center; background-color: #0f111a; padding: 15px; border: 2px solid rgba(157, 78, 221, 0.3); border-radius: 8px; margin-bottom: 20px; }
        @media(min-width: 400px) { .navbar { flex-direction: row; justify-content: space-between; } }
        .navbar brand { font-weight: bold; font-size: 13px; color: #a0aec0; text-transform: uppercase; }
        .secret-trigger { cursor: pointer; color: #9d4ede; }
        .nav-buttons button { background: none; border: 1px solid #9d4ede; color: #9d4ede; padding: 5px 12px; margin-left: 5px; cursor: pointer; border-radius: 4px; }
        .container { max-width: 480px; margin: 0 auto; background-color: #0b0c10; padding: 25px 20px; border-radius: 20px; border: 1px solid #9d4ede; }
        .page { display: none; } .page.active { display: block; }
        h2 { text-align: center; color: #9d4ede; font-size: 22px; }
        .subtitle { text-align: center; color: #7b2cbf; font-size: 11px; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #e0aaff; font-size: 13px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #3c096c; background-color: #161419; color: #fff; }
        .btn { width: 100%; padding: 14px; background-color: #7b2cbf; border: none; border-radius: 10px; color: #fff; cursor: pointer; font-weight: bold; }
        .lock-screen { text-align: center; padding: 40px 20px; color: #f72585; border: 2px dashed #f72585; border-radius: 12px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 10px; text-align: center; font-size: 11px; border: 1px solid #240046; }
        .action-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .btn-activate { background-color: #4cc9f0; color: #050508; }
        .btn-deactivate { background-color: #b5179e; color: #fff; }
        .glass-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; }
        .glass-overlay.active { display: flex; }
        .glass-modal { background: #10002b; padding: 25px; border-radius: 16px; border: 1px solid #9d4ede; }
    </style>
</head>
<body>

<div class="navbar">
    <brand>CREATED BY <span class="secret-trigger" onclick="openSecretAdmin()">OZOD</span> TRADER</brand>
    <div class="nav-buttons" id="nav-links"></div>
</div>

<div class="container">
    <div id="page-auth" class="page active">
        <h2>TIZIMGA KIRISH</h2>
        <div class="input-group"><label>Login:</label><input type="text" id="auth-username"></div>
        <div class="input-group"><label>Parol:</label><input type="password" id="auth-password"></div>
        <button class="btn" onclick="handleAuth()">Kirish</button>
        <p style="text-align:center; font-size:12px; cursor:pointer;" onclick="toggleAuthMode()" id="auth-toggle">Akkaunt yo'qmi? Ro'yxatdan o'tish</p>
    </div>

    <div id="page-calc" class="page">
        <h2>ALGORITHM</h2>
        <div id="premium-locked" class="lock-screen" style="display:none;">
            <h3>OBUNA FAOL EMAS! 🛑</h3>
            <p>Admin bilan bog'laning.</p>
        </div>
        <div id="calc-interface" style="display:none;">
            <div class="input-group"><label>High:</label><input type="number" id="high" step="any"></div>
            <div class="input-group"><label>Low:</label><input type="number" id="low" step="any"></div>
            <button class="btn" onclick="runQuadraticAlgo()">Hisoblash</button>
            <div id="calc-results" style="margin-top:20px;"></div>
        </div>
    </div>

    <div id="page-admin" class="page">
        <h2>ADMIN PANELI</h2>
        <table class="admin-table">
            <thead><tr><th>Login</th><th>Vaqt</th><th>Status</th><th>Amal</th></tr></thead>
            <tbody id="admin-user-table"></tbody>
        </table>
    </div>
</div>

<div class="glass-overlay" id="secretModalOverlay">
    <div class="glass-modal">
        <input type="password" id="secretCodeInput" placeholder="Kod...">
        <button class="btn" onclick="submitSecretCode()">OK</button>
    </div>
</div>

<script>
const FIREBASE_DB_URL = "https://kalkulyator-25ebc-default-rtdb.firebaseio.com/users";
let currentUser = null, isLoginMode = true, cloudUsers = {};

async function fetchUsersFromCloud() {
    const res = await fetch(`${FIREBASE_DB_URL}.json`);
    cloudUsers = await res.json() || {};
}

async function saveUserToCloud(username, userObj) {
    await fetch(`${FIREBASE_DB_URL}/${username}.json`, { method: 'PUT', body: JSON.stringify(userObj) });
    await fetchUsersFromCloud();
}

async function checkPremiumStatus() {
    let user = cloudUsers[currentUser];
    if (user && user.isPremium && user.expiryDate) {
        if (new Date() > new Date(user.expiryDate)) {
            user.isPremium = false; user.expiryDate = null;
            await saveUserToCloud(currentUser, user);
        }
    }
    document.getElementById('calc-interface').style.display = (user && (user.isPremium || user.isAdmin)) ? 'block' : 'none';
    document.getElementById('premium-locked').style.display = (user && (user.isPremium || user.isAdmin)) ? 'none' : 'block';
}

async function togglePremium(username) {
    let months = prompt("Necha oyga premium berish kerak? (1 yoki 3):", "1");
    if (months !== '1' && months !== '3') return;
    let expiry = new Date();
    expiry.setMonth(expiry.getMonth() + parseInt(months));
    cloudUsers[username].isPremium = true;
    cloudUsers[username].expiryDate = expiry.toISOString();
    await saveUserToCloud(username, cloudUsers[username]);
    renderAdminTable();
}

async function removePremium(username) {
    cloudUsers[username].isPremium = false; cloudUsers[username].expiryDate = null;
    await saveUserToCloud(username, cloudUsers[username]);
    renderAdminTable();
}

function renderAdminTable() {
    let tbody = document.getElementById('admin-user-table');
    tbody.innerHTML = '';
    for (let u in cloudUsers) {
        if (u === 'admin') continue;
        let user = cloudUsers[u];
        let status = user.isPremium ? new Date(user.expiryDate).toLocaleDateString() : "O'CHIK";
        tbody.innerHTML += `<tr><td>${u}</td><td>${user.lastLogin || ''}</td><td>${status}</td>
        <td><button class="action-btn ${user.isPremium?'btn-deactivate':'btn-activate'}" onclick="${user.isPremium?'removePremium':'togglePremium'}('${u}')">${user.isPremium?'O\'chirish':'Berish'}</button></td></tr>`;
    }
}

async function handleAuth() {
    let u = document.getElementById('auth-username').value.toLowerCase();
    let p = document.getElementById('auth-password').value;
    await fetchUsersFromCloud();
    if (isLoginMode) {
        if (cloudUsers[u] && cloudUsers[u].password === p) {
            currentUser = u;
            navigate(cloudUsers[u].isAdmin ? 'admin' : 'calc');
        } else alert("Xato!");
    } else {
        if (cloudUsers[u]) alert("Band!");
        else { await saveUserToCloud(u, {password: p, isPremium: false, isAdmin: false}); alert("Tayyor!"); }
    }
}

function navigate(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    if (p === 'calc') checkPremiumStatus();
    if (p === 'admin') renderAdminTable();
}

function toggleAuthMode() { isLoginMode = !isLoginMode; }
function openSecretAdmin() { document.getElementById('secretModalOverlay').classList.add('active'); }
function submitSecretCode() { if(document.getElementById('secretCodeInput').value === "888888343") { currentUser='admin'; navigate('admin'); document.getElementById('secretModalOverlay').classList.remove('active'); } }
function runQuadraticAlgo() { /* Hisoblash logikasi o'zgarishsiz */ alert("Hisoblandi!"); }

window.onload = fetchUsersFromCloud;
</script>
</body>
</html>
