<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ozod Trader Algorithm Pro</title>
    <style>
        body { font-family: 'Consolas', monospace; background-color: #050508; color: #e2e8f0; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background-color: #0b0c10; padding: 20px; border-radius: 20px; border: 1px solid #9d4ede; }
        .page { display: none; } .page.active { display: block; }
        h2 { text-align: center; color: #9d4ede; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #3c096c; background: #161419; color: #fff; }
        .btn { width: 100%; padding: 14px; background: #7b2cbf; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .section-title { text-align: center; color: #7b2cbf; font-size: 14px; margin: 20px 0 10px; border-bottom: 1px solid #3c096c; padding-bottom: 5px; }
        .zone-box { border: 1px solid #3c096c; padding: 12px; margin-bottom: 10px; text-align: center; border-radius: 8px; background: rgba(157, 78, 221, 0.05); }
        .zone-label { font-size: 11px; color: #e0aaff; margin-bottom: 5px; }
        .zone-value { font-size: 18px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div id="page-auth" class="page active">
        <h2>TIZIMGA KIRISH</h2>
        <input type="text" id="auth-username" placeholder="Foydalanuvchi nomi">
        <input type="password" id="auth-password" placeholder="Parol">
        <button class="btn" onclick="handleAuth()">KIRISH</button>
    </div>

    <div id="page-calc" class="page">
        <h2>OZOD TRADER ALGORITHM</h2>
        <input type="number" id="high" step="any" placeholder="Maksimal Narx (Max)">
        <input type="number" id="low" step="any" placeholder="Minimal Narx (Min)">
        <button class="btn" onclick="calculate()">HISOBLASH</button>
        
        <div id="results" style="display:none;">
            <div class="section-title">INTERNAL KEY ZONES</div>
            <div class="zone-box">
                <div class="zone-label">RESISTANCE ZONE</div>
                <div class="zone-value" id="res-int">0.000 - 0.000</div>
            </div>
            <div class="zone-box">
                <div class="zone-label">SUPPORT ZONE</div>
                <div class="zone-value" id="sup-int">0.000 - 0.000</div>
            </div>

            <div class="section-title">EXTERNAL EXTREME ZONES</div>
            <div class="zone-box">
                <div class="zone-label">EXTREME RESISTANCE</div>
                <div class="zone-value" id="res-ext">0.000 - 0.000</div>
            </div>
            <div class="zone-box">
                <div class="zone-label">EXTREME SUPPORT</div>
                <div class="zone-value" id="sup-ext">0.000 - 0.000</div>
            </div>
        </div>
    </div>
</div>

<script>
// Login/Auth mantiqi
function handleAuth() {
    const u = document.getElementById('auth-username').value;
    const p = document.getElementById('auth-password').value;
    if (u === "Ozod" && p === "1234") { // Buni o'zgartirishingiz mumkin
        document.getElementById('page-auth').classList.remove('active');
        document.getElementById('page-calc').classList.add('active');
    } else { alert("Login yoki parol xato!"); }
}

// Skrinshotlardagi formula mantiqi
function calculate() {
    const h = parseFloat(document.getElementById('high').value);
    const l = parseFloat(document.getElementById('low').value);
    if(isNaN(h) || isNaN(l)) return;
    
    const rng = h - l;
    
    // Internal Zones
    document.getElementById('res-int').innerText = `${(h - (rng * 0.02)).toFixed(3)} - ${(h + (rng * 0.03)).toFixed(3)}`;
    document.getElementById('sup-int').innerText = `${(l - (rng * 0.03)).toFixed(3)} - ${(l + (rng * 0.02)).toFixed(3)}`;
    
    // External Zones (Sizning skrinshotlardagi formulaga yaqin)
    document.getElementById('res-ext').innerText = `${(h + (rng * 0.25)).toFixed(3)} - ${(h + (rng * 0.75)).toFixed(3)}`;
    document.getElementById('sup-ext').innerText = `${(l - (rng * 0.75)).toFixed(3)} - ${(l - (rng * 0.25)).toFixed(3)}`;
    
    document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
