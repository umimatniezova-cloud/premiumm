<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozod Trader Algorithm Pro</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Consolas', monospace; background-color: #050508; color: #e2e8f0; margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; background-color: #0b0c10; padding: 25px 20px; border-radius: 20px; border: 1px solid #9d4ede; }
        .page { display: none; } .page.active { display: block; }
        h2 { text-align: center; color: #9d4ede; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #3c096c; background-color: #161419; color: #fff; }
        .btn { width: 100%; padding: 14px; background-color: #7b2cbf; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .snr-divider { text-align: center; margin: 25px 0; font-size: 12px; color: #7b2cbf; border-bottom: 1px dashed #3c096c; padding-bottom: 5px; }
        .zone-box { border-radius: 8px; padding: 15px; margin-top: 10px; text-align: center; border: 1px solid #3c096c; }
        .zone-res { border: 1px solid #ffb703; background: rgba(255, 183, 3, 0.05); }
        .zone-sup { border: 1px solid #219ebc; background: rgba(33, 158, 188, 0.05); }
        .zone-range { font-size: 18px; font-weight: bold; color: #fff; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .admin-table th, .admin-table td { border: 1px solid #240046; padding: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH PAGE -->
    <div id="page-auth" class="page active">
        <h2>TIZIMGA KIRISH</h2>
        <input type="text" id="auth-username" placeholder="Login">
        <input type="password" id="auth-password" placeholder="Parol">
        <button class="btn" id="auth-btn" onclick="handleAuth()">Kirish</button>
        <p style="text-align:center; font-size:12px; cursor:pointer;" onclick="toggleAuthMode()">Akkaunt yo'qmi? Ro'yxatdan o'tish</p>
    </div>

    <!-- CALC PAGE -->
    <div id="page-calc" class="page">
        <h2>ALGORITHM</h2>
        <input type="number" id="high" step="any" placeholder="High (Maksimal)">
        <input type="number" id="low" step="any" placeholder="Low (Minimal)">
        <button class="btn" onclick="calculate()">HISOBLASH</button>
        <div id="results" style="display:none;">
            <div class="snr-divider">INTERNAL ZONES</div>
            <div class="zone-box zone-res"><div class="zone-range" id="res-1">0.000 — 0.000</div></div>
            <div class="zone-box zone-sup"><div class="zone-range" id="sup-1">0.000 — 0.000</div></div>
            <div class="snr-divider">EXTERNAL ZONES</div>
            <div class="zone-box zone-res"><div class="zone-range" id="res-2">0.000 — 0.000</div></div>
            <div class="zone-box zone-sup"><div class="zone-range" id="sup-2">0.000 — 0.000</div></div>
        </div>
    </div>
</div>

<script>
const DB_URL = "https://kalkulyator-25ebc-default-rtdb.firebaseio.com/users";
let currentUser = null;
let isLoginMode = true;

async function handleAuth() {
    const userIn = document.getElementById('auth-username').value.trim().toLowerCase();
    const passIn = document.getElementById('auth-password').value.trim();
    const res = await fetch(`${DB_URL}.json`);
    const users = await res.json() || {};

    if (isLoginMode) {
        if (users[userIn] && users[userIn].password === passIn) {
            currentUser = userIn;
            document.getElementById('page-auth').classList.remove('active');
            document.getElementById('page-calc').classList.add('active');
        } else { alert("Login yoki parol xato!"); }
    } else {
        if (users[userIn]) { alert("Bu login band!"); }
        else {
            await fetch(`${DB_URL}/${userIn}.json`, { method: 'PUT', body: JSON.stringify({ password: passIn, isPremium: true }) });
            alert("Ro'yxatdan o'tdingiz!");
            location.reload();
        }
    }
}

function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('auth-btn').innerText = isLoginMode ? "Kirish" : "Ro'yxatdan O'tish";
}

function calculate() {
    const h = parseFloat(document.getElementById('high').value);
    const l = parseFloat(document.getElementById('low').value);
    if (isNaN(h) || isNaN(l)) return;
    const rng = h - l;
    
    // Internal
    document.getElementById('res-1').innerText = `${(h - (rng * 0.02)).toFixed(3)} — ${(h + (rng * 0.03)).toFixed(3)}`;
    document.getElementById('sup-1').innerText = `${(l - (rng * 0.03)).toFixed(3)} — ${(l + (rng * 0.02)).toFixed(3)}`;
    
    // External (4217-4219 logikasi)
    document.getElementById('res-2').innerText = `${(h + (rng * 0.25)).toFixed(3)} — ${(h + (rng * 0.75)).toFixed(3)}`;
    document.getElementById('sup-2').innerText = `${(l - (rng * 0.75)).toFixed(3)} — ${(l - (rng * 0.25)).toFixed(3)}`;
    
    document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
